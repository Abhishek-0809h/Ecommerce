<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Ecommerce</title>
<style>
body{font-family:Arial;margin:0;background:#f5f5f5}
header{background:#111;color:#fff;padding:15px;text-align:center}
.container{display:flex}
.products{width:70%;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;padding:15px}
.card{background:#fff;padding:10px;border-radius:8px;text-align:center;box-shadow:0 0 5px rgba(0,0,0,0.1)}
.card img{width:100%;height:150px;object-fit:cover}
button{padding:8px 12px;border:none;background:#007bff;color:#fff;border-radius:5px;cursor:pointer}
button:hover{background:#0056b3}
.cart{width:30%;background:#fff;padding:15px;border-left:2px solid #ddd}
.cart-item{display:flex;justify-content:space-between;margin-bottom:10px}
.total{font-weight:bold;margin-top:15px}
</style>
</head>
<body>
<header>
<h1>Mini Ecommerce Store</h1>
</header>

<div class="container">
<div class="products" id="products"></div>

<div class="cart">
<h2>Cart</h2>
<div id="cartItems"></div>
<div class="total">Total: ₹<span id="total">0</span></div>
</div>
</div>

<script>
const products=[
{id:1,name:"Shoes",price:999,img:"https://picsum.photos/200?1"},
{id:2,name:"Watch",price:1499,img:"https://picsum.photos/200?2"},
{id:3,name:"Bag",price:799,img:"https://picsum.photos/200?3"},
{id:4,name:"Headphones",price:1999,img:"https://picsum.photos/200?4"}
];

let cart=[];

function renderProducts(){
const container=document.getElementById("products");
container.innerHTML="";
products.forEach(p=>{
const div=document.createElement("div");
div.className="card";
div.innerHTML=`
<img src="${p.img}">
<h3>${p.name}</h3>
<p>₹${p.price}</p>
<button onclick="addToCart(${p.id})">Add to Cart</button>
`;
container.appendChild(div);
});
}

function addToCart(id){
const product=products.find(p=>p.id===id);
const item=cart.find(i=>i.id===id);
if(item){item.qty++}
else{cart.push({...product,qty:1})}
renderCart();
}

function removeFromCart(id){
cart=cart.filter(i=>i.id!==id);
renderCart();
}

function renderCart(){
const cartDiv=document.getElementById("cartItems");
cartDiv.innerHTML="";
let total=0;

cart.forEach(item=>{
total+=item.price*item.qty;
const div=document.createElement("div");
div.className="cart-item";
div.innerHTML=`
<span>${item.name} x${item.qty}</span>
<button onclick="removeFromCart(${item.id})">X</button>
`;
cartDiv.appendChild(div);
});

document.getElementById("total").innerText=total;
}

renderProducts();
</script>
</body>
</html>
